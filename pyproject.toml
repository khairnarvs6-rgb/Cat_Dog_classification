[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-dog-cnn"
version = "1.0.0"
description = "Cat-versus-dog image classification with TensorFlow and a CNN"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "tensorflow==2.15.1",
    "numpy<2",
    "pandas>=2.1,<3",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.8,<4",
    "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.2,<5",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
